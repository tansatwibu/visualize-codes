<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Stock Analytics — Thống kê mã theo ngày</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <header class="app-header">
      <div class="header-inner">
        <div class="header-brand">
          <span class="brand-icon"></span>
          <div class="brand-text">
            <h1>Stock Analytics</h1>
            <p>Thống kê mã theo ngày</p>
          </div>
        </div>
        <div class="header-right">
          <span class="header-date" id="headerDate"></span>
        </div>
      </div>
    </header>

    <section class="kpi-bar" id="kpiBar">
      <div class="kpi-card"><span class="kpi-label">Tổng mã</span><span class="kpi-value" id="kpiTotalCodes">—</span></div>
      <div class="kpi-card"><span class="kpi-label">Tổng ngày</span><span class="kpi-value" id="kpiTotalDays">—</span></div>
      <div class="kpi-card"><span class="kpi-label">Mã xuất hiện nhiều nhất</span><span class="kpi-value" id="kpiTopCode">—</span></div>
      <div class="kpi-card"><span class="kpi-label">Tần suất cao nhất</span><span class="kpi-value" id="kpiMaxCount">—</span></div>
    </section>

    <main class="dashboard">
      <section class="dashboard-left">
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">Biểu đồ theo ngày</h2>
            <div class="panel-control">
              <label for="monthPicker">Tháng</label>
              <input id="monthPicker" type="month" />
            </div>
          </div>
          <div class="chart-card loading-container"><canvas id="monthChart"></canvas></div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">Biểu đồ theo tháng</h2>
            <div class="panel-control">
              <label for="yearPicker">Năm</label>
              <input id="yearPicker" type="number" min="2000" max="2100" />
            </div>
          </div>
          <div class="chart-card loading-container"><canvas id="yearChart"></canvas></div>
        </div>
      </section>

      <section class="dashboard-right">
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">Top mã xuất hiện</h2>
            <div class="range-toggle" id="rangeToggle">
              <button data-days="30" class="active">30D</button>
              <button data-days="60">60D</button>
              <button data-days="90">90D</button>
              <button data-days="365">1Y</button>
            </div>
          </div>
          <div class="data-block loading-container">
            <table id="codes-table">
              <thead><tr><th>Mã</th><th class="num">Số lần</th><th class="num">% LN thấp</th><th class="num">% LN cao</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">Mã theo ngày</h2>
            <div class="panel-control">
              <label for="datePicker">Ngày</label>
              <input id="datePicker" type="date" />
            </div>
          </div>
          <div class="data-block loading-container">
            <table id="date-table">
              <thead><tr><th>Mã</th><th class="num">Số lần</th><th class="num">% LN thấp</th><th class="num">% LN cao</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">Lịch sử mã</h2>
            <div class="search-box">
              <span class="search-icon">⌕</span>
              <input id="codeSearch" type="search" placeholder="Tìm mã cổ phiếu..." />
            </div>
          </div>
          <div class="data-block loading-container">
            <table id="history-table">
              <thead><tr><th>Mã</th><th>Ngày</th><th class="num">% LN thấp</th><th class="num">% LN cao</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </section>

    </main>

    <footer class="app-footer">
      <span>Stock Analytics Dashboard</span>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/charts.js"></script>
    <script src="/js/tables.js"></script>
    <script src="/js/dashboard.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
